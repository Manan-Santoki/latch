name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Do not** paste real verification codes, links, tokens, or
        email contents. For a security vulnerability, use the Security policy instead
        (see SECURITY.md) — not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Latch version / commit
    validations:
      required: false
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized service-worker logs (optional)
      description: |
        The `[Latch]` lines from the service-worker console (they contain counts/levels only,
        never content). chrome://extensions → Latch → "Inspect views: service worker".
      render: text
